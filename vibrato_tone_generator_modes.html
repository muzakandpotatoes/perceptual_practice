<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrato Tone Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 80%;
            max-width: 500px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .modes, .vowels {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tog.on {
            background-color: #2563eb;
            color: white;
        }
        .vb {
            margin: 5px;
            padding: 5px 10px;
        }
        .vb .w {
            font-size: 12px;
            color: #666;
            margin-left: 4px;
        }
        .vb.on .w {
            color: #dbeafe;
        }
        .vb:disabled {
            opacity: .4;
            cursor: default;
        }
        .hint {
            font-size: 14px;
            color: #666;
        }
        #cv {
            width: 100%;
            height: 140px;
            display: block;
            margin: 10px 0 20px;
        }
        .range-sliders {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .slider-container {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 5px 0;
        }
        .slider-container input {
            flex-grow: 1;
            margin: 0 10px;
        }
        .slider-label {
            width: 110px;
            text-align: right;
        }
        .slider-value {
            min-width: 90px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vibrato Tone Generator</h1>
        <p>Choose a sound mode:</p>
        <div class="modes">
            <button class="tog on" id="bSine">Sine</button>
            <button class="tog" id="bHarm">Harmonics</button>
            <button class="tog" id="bForm">Formants</button>
            <button class="tog" id="bSing">Singer's formant</button>
        </div>
        <div class="vowels" id="vw"></div>
        <p class="hint" id="hint"></p>
        <canvas id="cv" aria-hidden="true"></canvas>
        <div class="range-sliders">
            <div class="slider-container">
                <label class="slider-label" for="pitch">Pitch:</label>
                <input type="range" id="pitch" min="80" max="600" step="1" value="220">
                <span class="slider-value" id="pitchV"></span>
            </div>
            <div class="slider-container">
                <label class="slider-label" for="rate">Vibrato rate:</label>
                <input type="range" id="rate" min="0" max="12" step="0.1" value="5.5">
                <span class="slider-value" id="rateV"></span>
            </div>
            <div class="slider-container">
                <label class="slider-label" for="depth">Vibrato depth:</label>
                <input type="range" id="depth" min="0" max="200" step="1" value="30">
                <span class="slider-value" id="depthV"></span>
            </div>
            <div class="slider-container">
                <label class="slider-label" for="vol">Volume:</label>
                <input type="range" id="vol" min="0" max="100" step="1" value="50">
                <span class="slider-value" id="volV"></span>
            </div>
        </div>
        <button id="play">Play</button>
    </div>

<script>
const $=id=>document.getElementById(id);
const VOWELS=[['i','heed',270,2290,3010],['ɪ','hid',390,1990,2550],['ɛ','head',530,1840,2480],['æ','had',660,1720,2410],['ɑ','hod',730,1090,2440],['ɔ','hawed',570,840,2410],['ʊ','hood',440,1020,2240],['u','who\u2019d',300,870,2240],['ʌ','hud',640,1190,2390],['ɝ','heard',490,1350,1690]];
const BW=[90,110,170,250,300],BWS=[90,110,130,150,200],NH=60;
let ctx,osc,lfo,lfoGain,master,post,chain,harmWave,playing=false,mode='sine',vowel=4;
const isForm=()=>mode==='form'||mode==='sing';
function fList(idx,sing){const [, ,f1,f2,f3]=VOWELS[idx];if(!sing)return [f1,f2,f3,3300,3750].map((f,i)=>[f,BW[i]]);const F=f3<2000?[f1,f2,f3,2800,3100]:[f1,f2,2600,2850,3150];return F.map((f,i)=>[f,BWS[i]])}
function coef(F,B,sr){const T=1/sr,c=-Math.exp(-2*Math.PI*B*T),b=2*Math.exp(-Math.PI*B*T)*Math.cos(2*Math.PI*F*T);return [1-b-c,b,c]}
function coefs(idx,sing,sr){return fList(idx,sing).map(([F,B])=>coef(F,B,sr))}
function mag(C,f,sr){let m=1;const w=2*Math.PI*f/sr,cw=Math.cos(w),sw=Math.sin(w),c2=Math.cos(2*w),s2=Math.sin(2*w);for(const [A,b,c] of C)m*=A/Math.hypot(1-b*cw-c*c2,b*sw+c*s2);return m}
function vol(){const v=$('vol').value/100;if(mode==='sine')return 0.3*v;return isForm()?0.6*v:0.16*v}
function buildChain(){
let first=null,prev=null;
for(const [A,b,c] of coefs(vowel,mode==='sing',ctx.sampleRate)){const f=ctx.createIIRFilter([A],[1,-b,-c]);if(prev)prev.connect(f);else first=f;prev=f}
prev.connect(post);return {in:first,out:prev};
}
function init(){
ctx=new (window.AudioContext||window.webkitAudioContext)();
const sr=ctx.sampleRate;
master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
post=ctx.createGain();post.connect(master);
let maxSum=0;
for(let i=0;i<VOWELS.length;i++)for(const s of [false,true]){
const C=coefs(i,s,sr);
for(let f0=75;f0<=620;f0+=2){let t=0;for(let n=1;n<=NH&&n*f0<sr/2;n++)t+=mag(C,n*f0,sr)/n;if(t>maxSum)maxSum=t}
}
post.gain.value=1/maxSum;
chain=buildChain();
const re=new Float32Array(NH+1),im=new Float32Array(NH+1);
for(let n=1;n<=NH;n++)im[n]=1/n;
harmWave=ctx.createPeriodicWave(re,im,{disableNormalization:true});
}
function rebuild(){if(!ctx)return;const old=chain;chain=buildChain();route();setTimeout(()=>old.out.disconnect(),400)}
function route(){if(!osc)return;osc.disconnect();osc.connect(isForm()?chain.in:master)}
function setWave(){if(!osc)return;if(mode==='sine')osc.type='sine';else osc.setPeriodicWave(harmWave)}
function start(){
if(!ctx)init();
ctx.resume();
osc=ctx.createOscillator();osc.frequency.value=+$('pitch').value;setWave();
lfo=ctx.createOscillator();lfo.frequency.value=+$('rate').value;
lfoGain=ctx.createGain();lfoGain.gain.value=+$('depth').value;
lfo.connect(lfoGain);lfoGain.connect(osc.detune);
route();osc.start();lfo.start();
master.gain.setTargetAtTime(vol(),ctx.currentTime,0.03);
playing=true;$('play').textContent='Stop';
}
function stop(){
master.gain.setTargetAtTime(0,ctx.currentTime,0.03);
const o=osc,l=lfo;setTimeout(()=>{o.stop();l.stop();o.disconnect();l.disconnect()},200);
osc=null;lfo=null;playing=false;$('play').textContent='Play';
}
function draw(){
const cv=$('cv'),dpr=window.devicePixelRatio||1,W=cv.clientWidth||680,H=140;
cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
const cs=getComputedStyle(document.documentElement),col=(v,d)=>cs.getPropertyValue(v).trim()||d;
const cAx=col('--border-strong','rgba(128,128,128,.4)'),cTx=col('--text-secondary','#888'),cCurve=col('--text-muted','#aaa'),cStem=col('--text-accent','#378ADD');
const fmax=4000,top=6,bot=H-20,R=50,x=f=>f/fmax*W,y=db=>top+Math.min(R,Math.max(0,-db))/R*(bot-top);
g.strokeStyle=cAx;g.lineWidth=1;g.beginPath();g.moveTo(0,bot+.5);g.lineTo(W,bot+.5);g.stroke();
g.fillStyle=cTx;g.font='11px '+col('--font-sans','sans-serif');g.textAlign='center';
for(let k=1;k<=3;k++){const X=Math.round(x(k*1000))+.5;g.beginPath();g.moveTo(X,bot);g.lineTo(X,bot+4);g.stroke();g.fillText(k+' kHz',X,H-5)}
const f0=+$('pitch').value;
g.strokeStyle=cStem;g.lineWidth=2;
if(mode==='sine'){g.beginPath();g.moveTo(x(f0),bot);g.lineTo(x(f0),y(0));g.stroke();return}
const on=isForm(),C=coefs(vowel,mode==='sing',48000);
const amp=f=>(f0/f)*(on?mag(C,f,48000):1);
let ref=0;for(let f=f0;f<=fmax;f+=4)ref=Math.max(ref,amp(f));
const db=f=>20*Math.log10(amp(f)/ref);
g.strokeStyle=cCurve;g.lineWidth=1;g.beginPath();
for(let f=f0;f<=fmax;f+=4){const X=x(f),Y=y(db(f));if(f===f0)g.moveTo(X,Y);else g.lineTo(X,Y)}
g.stroke();
g.strokeStyle=cStem;g.lineWidth=2;
for(let n=1;n<=NH&&n*f0<fmax;n++){const f=n*f0;g.beginPath();g.moveTo(x(f),bot);g.lineTo(x(f),y(db(f)));g.stroke()}
}
const vbtns=VOWELS.map((v,i)=>{const b=document.createElement('button');b.className='tog vb';b.innerHTML='<span>'+v[0]+'</span><span class="w">'+v[1]+'</span>';b.setAttribute('aria-label','Vowel '+v[0]+' as in '+v[1]);b.onclick=()=>{vowel=i;rebuild();refresh()};$('vw').appendChild(b);return b});
const HINTS={sine:'Single sine wave. No vowel colouring.',harm:'Raw 1/n harmonic stack, no vocal tract filtering.',form:'Five-resonator cascade, speech-like F3–F5.',sing:'Same vowel, with F3–F5 clustered near 2.8 kHz.'};
function refresh(){
$('bSine').classList.toggle('on',mode==='sine');
$('bHarm').classList.toggle('on',mode==='harm');
$('bForm').classList.toggle('on',mode==='form');
$('bSing').classList.toggle('on',mode==='sing');
vbtns.forEach((b,i)=>{b.classList.toggle('on',isForm()&&i===vowel);b.disabled=!isForm()});
$('hint').textContent=HINTS[mode];
$('pitchV').textContent=$('pitch').value+' Hz';
$('rateV').textContent=(+$('rate').value).toFixed(1)+' Hz';
$('depthV').textContent='±'+$('depth').value+' cents';
$('volV').textContent=$('vol').value+'%';
if(playing){
const t=ctx.currentTime;
osc.frequency.setTargetAtTime(+$('pitch').value,t,0.02);
lfo.frequency.setTargetAtTime(+$('rate').value,t,0.02);
lfoGain.gain.setTargetAtTime(+$('depth').value,t,0.02);
master.gain.setTargetAtTime(vol(),t,0.03);
}
draw();
}
function setMode(m){const was=mode;mode=m;if(isForm()&&(!was||was!==m))rebuild();setWave();route();refresh()}
$('play').onclick=()=>playing?stop():start();
$('bSine').onclick=()=>setMode('sine');
$('bHarm').onclick=()=>setMode('harm');
$('bForm').onclick=()=>setMode('form');
$('bSing').onclick=()=>setMode('sing');
['pitch','rate','depth','vol'].forEach(id=>$(id).oninput=refresh);
refresh();
</script>
</body>
</html>
